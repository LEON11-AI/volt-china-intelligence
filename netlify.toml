[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/business"
  to = "/intelligence"
  status = 301
  force = true

[[redirects]]
  from = "/sample-brief"
  to = "/research/byd-solid-state-battery-2026"
  status = 301
  force = true

[[redirects]]
  from = "/research/solid-state-battery"
  to = "/research/byd-solid-state-battery-2026"
  status = 301
  force = true

[[redirects]]
  from = "/reports/solid-state"
  to = "/research/byd-solid-state-battery-2026"
  status = 301
  force = true

[[redirects]]
  from = "/research/index"
  to = "/research"
  status = 301
  force = true
[[redirects]]
  from = "/media"
  to = "/#media-partnerships"
  status = 301
  force = true
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/exclusive/vip-cost-8848"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/exclusive/vip-supply-9961"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/exclusive/huawei-cost.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/exclusive/huawei-stocks.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
